<script>
  // Função para chamar a API e salvar paciente
  async function salvarPaciente() {
    try {
      // Monta os dados dos campos (ajuste IDs conforme seus inputs)
      const nome = document.getElementById('nomeCompleto').value;
      const urlFoto = document.getElementById('urlFoto').value;
      const medicacao = document.getElementById('medicacao').value;
      const observacao = document.getElementById('observacao').value;
      const dataExame = document.getElementById('dataExame').value;
      const dataConsulta = document.getElementById('dataConsulta').value;
      const localConsulta = document.getElementById('localConsulta').value;

      const payload = {
        name: nome,
        avatarUrl: urlFoto,
        medications: [ medicacao ],
        nextExam: { name: observacao, date: dataExame },
        nextAppointment: { location: localConsulta, date: dataConsulta }
      };

      const response = await fetch('/api/patients', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ data: payload })
      });

      const json = await response.json();

      if (!response.ok || !json.ok) {
        throw new Error(json.error || 'Erro ao salvar paciente');
      }

      alert('Paciente salvo com sucesso!');
      // Limpar formulario ou dar redirect conforme desejar
      document.getElementById('modalPaciente').reset();

    } catch (err) {
      console.error(err);
      alert('Falha ao salvar paciente: ' + err.message);
    }
  }

  // Adiciona o listener ao botão
  document.getElementById('btnSalvarPaciente').addEventListener('click', (e) => {
    e.preventDefault();
    salvarPaciente();
  });
</script>
