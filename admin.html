<script>
// exemplo simples de listagem (Firestore Web v8)
async function listarPacientes() {
  const listEl = document.getElementById('lista-pacientes'); // ul/ol/div
  listEl.innerHTML = 'Carregando...';
  try {
    const snap = await firebase.firestore().collection('patients').orderBy('name', 'asc').limit(50).get();
    if (snap.empty) {
      listEl.innerHTML = 'Nenhum paciente encontrado.';
      return;
    }
    listEl.innerHTML = '';
    snap.forEach(doc => {
      const d = doc.data();
      const li = document.createElement('div');
      li.textContent = `${d.name || doc.id}`;
      listEl.appendChild(li);
    });
  } catch (e) {
    console.error(e);
    listEl.innerHTML = 'Erro ao carregar: ' + e.message;
  }
}
document.addEventListener('DOMContentLoaded', listarPacientes);
</script>
