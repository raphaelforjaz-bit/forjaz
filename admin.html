<script>
(function () {
  function val(id) {
    const el = document.getElementById(id);
    return el ? (el.value || '').trim() : '';
  }

  async function salvarPaciente() {
    try {
      const payload = {
        name: val('nomeCompleto'),
        avatarUrl: val('urlFoto'),
        // se você tiver múltiplas medicações, depois adaptamos para um array dinâmico
        medications: [
          {
            name: val('medicacao'),
            note: '' // se tiver um campo de nota separado, coloque o id aqui
          }
        ],
        nextExam: {
          name: val('observacao'),     // ajuste se tiver um campo separado para "nome do exame"
          date: val('dataExame'),
          note: ''                     // ajuste se tiver um campo de observação do exame
        },
        nextAppointment: {
          description: '',             // se tiver um campo de descrição da consulta, coloca o id aqui
          date: val('dataConsulta'),
          location: val('localConsulta')
        }
      };

      const resp = await fetch('/api/patients', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: payload })
      });

      const json = await resp.json();
      console.log('Resposta API /api/patients:', json);

      if (!resp.ok || !json.ok) {
        throw new Error(json.error || 'Erro ao salvar paciente');
      }

      alert('✅ Paciente salvo com sucesso!');
      const form = document.getElementById('modalPaciente');
      if (form && typeof form.reset === 'function') form.reset();
    } catch (err) {
      console.error(err);
      alert('❌ Falha ao salvar paciente: ' + (err?.message || err));
    }
  }

  const btn = document.getElementById('btnSalvarPaciente');
  if (btn) {
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      salvarPaciente();
    });
  } else {
    console.warn('Botão #btnSalvarPaciente não encontrado no DOM.');
  }
})();
</script>
